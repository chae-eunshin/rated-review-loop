# Comments on a pull request only when review usefulness drops, and removes the comment once it recovers.
# Copy to .github/workflows/review-health.yml. It reads the committed ledger; no model or API key is needed.
name: Review health

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No project dependencies are installed, and a cache restored in a pull request job can be poisoned.
          package-manager-cache: false
      # Runs the version pinned in package.json (a semver range or a release tarball URL) without installing the
      # project's dependencies, so it works the same in npm, pnpm and yarn repositories.
      - name: Compute review health
        run: |
          SPEC=$(node -p "const p = require('./package.json'); ({ ...p.dependencies, ...p.devDependencies })['rated-review-loop'] ?? 'latest'")
          npx --yes --package="rated-review-loop@${SPEC}" rated-review-loop stats --format markdown > review-health.md
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- rated-review-loop:health -->";
            const report = fs.readFileSync("review-health.md", "utf8").trim();
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find((comment) => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (!report) {
              if (previous) await github.rest.issues.deleteComment({ ...context.repo, comment_id: previous.id });
              return;
            }
            const body = `${marker}\n${report}`;
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...issue, body });
