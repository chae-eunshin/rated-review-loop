name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "edited" reruns the README check when a one-sided change reason is added to the description.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:package
      - name: CLI smoke test
        run: |
          node dist/cli.js 2>&1 | grep -q "Usage: rated-review-loop"

  readme-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check README structure
        if: github.event_name != 'pull_request'
        run: node scripts/check-readme-sync.ts
      - name: Check README structure and one-sided changes
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-readme-sync.ts --base origin/${{ github.base_ref }}
