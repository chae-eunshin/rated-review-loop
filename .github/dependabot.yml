# Keeps GitHub Actions and npm dependencies current, so a deprecated runtime is caught by a pull request
# instead of a workflow warning.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Node types follow the oldest supported Node (engines: >=22). Newer majors would type-check APIs that
      # Node 22 users do not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1 (typescript-eslint#10940). Move to TypeScript 7 by hand
      # once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
